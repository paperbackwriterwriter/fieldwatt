name: nightly-feed

on:
  schedule:
    - cron: "15 8 * * *"   # 8:15 UTC daily: 3:15 AM Central in summer, 2:15 AM in winter
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: "Skip the Adzuna fetch and just rebuild from data/jobs.json"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch jobs from Adzuna
        if: ${{ !inputs.skip_fetch }}
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/fetch_jobs.py

      - name: Build static site
        run: python scripts/build.py

      - name: Commit and push
        run: |
          git config user.name "fieldwatt-bot"
          git config user.email "bot@fieldwatt.com"
          git add -A data site
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Nightly feed update $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      # After the push, so the pages exist by the time Google fetches them.
      - name: Tell Google which job pages changed
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          if [ -z "$GOOGLE_INDEXING_KEY" ]; then echo "GOOGLE_INDEXING_KEY not set; skipping"; exit 0; fi
          pip install -q google-auth requests
          python scripts/index_google.py
          git add data/indexing-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Indexing state $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      # Last, so a broken form handler fails the run (and emails you) without
      # holding up the feed. A syntax error here once took the forms down.
      - name: Check the form handlers load
        if: always()
        run: |
          for f in api/*.js; do node --check "$f"; done
          node -e "require('./api/lead.js'); require('./api/confirm.js')"
