name: tuesday-email

on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesdays 12:00 UTC: 7 AM Central in summer, 6 AM in winter
  workflow_dispatch:
    inputs:
      test_only:
        description: "Send only to LEAD_TO (test) instead of the segment"
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send the Tuesday email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_ID: ${{ secrets.RESEND_SEGMENT_ID }}
          LEAD_TO: ${{ secrets.LEAD_TO }}
          LEAD_FROM: ${{ secrets.LEAD_FROM }}
          # The Tuesday schedule sends the real broadcast; a manual run is a
          # test unless the box is unticked.
          TEST_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.test_only || 'false' }}
        run: python scripts/tuesday_email.py
